{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}
{% get_available_languages as LANGUAGES %}
<form action="{% url 'set_language' %}" method="post" class="lang-switch ml-2 mr-2">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <div class="btn-group btn-group-sm" role="group" aria-label="{% trans 'Langue' %}">
    {% for code, name in LANGUAGES %}
    <button type="submit" name="language" value="{{ code }}" title="{{ name }}"
            class="btn {% if code == LANGUAGE_CODE %}btn-primary{% else %}btn-outline-secondary{% endif %}"
            {% if code == LANGUAGE_CODE %}aria-pressed="true"{% endif %}>
      {{ code|upper }}
    </button>
    {% endfor %}
  </div>
</form>
